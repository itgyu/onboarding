<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소프트먼트 온보딩</title>
<style>
/* ============================================================
   소프트먼트 온보딩 · 디자인 시스템 v3
   토큰 → 기본 → 컴포넌트 → 레이아웃 순
   ============================================================ */
:root{
  /* --- color: surface --- */
  --bg:#FFFFFF; --section:#F7F8FA; --card:#FFFFFF; --sunken:#F2F4F6;
  --line:#EAEDF1; --line-2:#DCE0E6;
  /* --- color: text --- */
  --ink:#191F28; --sub:#4E5968; --muted:#8B95A1; --faint:#B0B8C1;
  /* --- color: semantic --- */
  --blue:#3182F6; --blue-d:#1B64DA; --blue-weak:#EDF4FE; --blue-ink:#1B64DA;
  --good:#00A26B; --good-weak:#E5F6EF;
  --warn:#E08700; --warn-weak:#FFF6E5;
  --danger:#EF3E4A; --danger-weak:#FEECEE;
  --purple:#7C4DFF; --purple-weak:#F1ECFF;
  /* --- type scale (8단계) --- */
  --fs-display:27px; --fs-h1:22px; --fs-h2:17px; --fs-h3:15px;
  --fs-body:14px; --fs-sm:13px; --fs-xs:12px; --fs-micro:11px;
  /* --- radius (5단계) --- */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-full:999px;
  /* --- elevation --- */
  --shadow-sm:0 1px 2px rgba(25,31,40,.05);
  --shadow:0 2px 8px rgba(25,31,40,.05),0 1px 2px rgba(25,31,40,.04);
  --shadow-lg:0 12px 32px rgba(25,31,40,.12);
  /* --- layout --- */
  --wrap:1200px; --pad:24px;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
/* 스크롤바 자리를 항상 예약 → 탭 전환 시 좌우 흔들림(레이아웃 시프트) 방지 */
html{scrollbar-gutter:stable}
@supports not (scrollbar-gutter:stable){html{overflow-y:scroll}}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;font-size:var(--fs-body)}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;cursor:pointer;letter-spacing:-.011em}
a{color:var(--blue)}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--blue-weak)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:var(--r-xs)}
button:focus:not(:focus-visible){outline:none}

/* ============================ TOP BAR ============================ */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);height:58px}
.top .inner{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:100%;
  display:flex;align-items:center;gap:12px}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.dot{width:26px;height:26px;border-radius:8px;background:var(--blue);display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:900;flex:none}
.top .sp{flex:1}
.whoami{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:700;color:var(--sub);
  background:var(--section);border-radius:var(--r-full);padding:6px 13px}
.whoami .rb{font-size:10.5px;font-weight:800;border-radius:var(--r-xs);padding:2px 6px}
.savest{font-size:var(--fs-sm);font-weight:700;color:var(--muted);transition:color .2s}
.savest.ok{color:var(--good)} .savest.err{color:var(--danger)}

/* ============================ BUTTONS ============================ */
.btn{border:0;border-radius:var(--r-md);padding:15px 24px;font-weight:800;font-size:15.5px;
  transition:transform .06s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.primary[disabled]{background:var(--sunken);color:var(--faint);cursor:not-allowed}
.btn.sub{background:var(--card);border:1px solid var(--line-2);color:var(--sub)}
.btn.sub:hover{background:var(--section)}
.btn.sub[disabled]{opacity:.45;cursor:not-allowed}
/* ghost = 보조 액션 (기본 높이 36px) */
.ghost{border:1px solid var(--line-2);background:var(--card);color:var(--sub);border-radius:var(--r-sm);
  padding:8px 13px;font-weight:700;font-size:var(--fs-sm);transition:background .15s,border-color .15s,color .15s}
.ghost:hover{background:var(--section);border-color:var(--line-2);color:var(--ink)}
.ghost.blue{color:var(--blue-ink);border-color:transparent;background:var(--blue-weak)}
.ghost.blue:hover{background:#DDEAFD;color:var(--blue-d)}
.ghost.danger{color:var(--danger);border-color:var(--line-2)}
.ghost.danger:hover{background:var(--danger-weak);border-color:var(--danger-weak);color:var(--danger)}
.ghost.sm{padding:6px 10px;font-size:var(--fs-xs)}

/* ============================ SUB NAV (탭) ============================ */
.subnav{position:sticky;top:58px;z-index:35;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.subnav .inner{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);display:flex;gap:4px;
  overflow-x:auto;scrollbar-width:none}
.subnav .inner::-webkit-scrollbar{display:none}
.tabbtn{position:relative;border:0;background:transparent;color:var(--muted);font-weight:700;
  font-size:14.5px;padding:15px 14px 14px;white-space:nowrap;transition:color .15s}
.tabbtn:hover{color:var(--sub)}
.tabbtn.on{color:var(--blue);font-weight:800}
.tabbtn.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;
  background:var(--blue);border-radius:2px 2px 0 0}

/* ============================ PAGE HEAD ============================ */
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead .ptxt{flex:1;min-width:240px}
.pagehead h2{font-size:var(--fs-h1);font-weight:900;letter-spacing:-.035em;line-height:1.3}
.pagehead .psub{font-size:var(--fs-sm);color:var(--muted);margin-top:5px;line-height:1.55}
.pagehead .pact{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
/* 구버전 호환 */
.adminhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.adminhead h2{font-size:var(--fs-h1);font-weight:900;letter-spacing:-.035em}

/* ============================ PANEL (공통 카드) ============================ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.panel + .panel{margin-top:16px}
.panel .phd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .phd h3{font-size:var(--fs-h2);font-weight:800;letter-spacing:-.02em}
.panel .phd .psub2{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.panel .pbd{padding:20px}
.panel .pbd.tight{padding:8px}
.panel .pbd.flush{padding:0}

/* ============================ BRAND FLOW ============================ */
.main{max-width:780px;margin:0 auto;padding:26px 20px 64px}
/* stepper */
.stepper{display:flex;gap:6px;margin-bottom:22px}
.stepper .st{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;
  background:none;border:0;padding:0;text-align:left;font-family:inherit}
.stepper .st.go{cursor:pointer}
.stepper .bar{height:5px;border-radius:var(--r-full);background:var(--line);transition:background .3s}
.stepper .st.done .bar{background:var(--blue)}
.stepper .st.cur .bar{background:var(--blue-weak);box-shadow:inset 0 0 0 1.5px var(--blue)}
.stepper .st.go:hover .bar{background:var(--blue-d)}
.stepper .lbw{display:flex;align-items:baseline;gap:5px;min-width:0}
.stepper .lb{font-size:var(--fs-micro);font-weight:700;color:var(--faint);white-space:nowrap;flex:none}
.stepper .nm{font-size:var(--fs-micro);font-weight:700;color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stepper .st.done .lb,.stepper .st.done .nm{color:var(--sub)}
.stepper .st.cur .lb,.stepper .st.cur .nm{color:var(--blue);font-weight:800}
/* 카드 안 섹션 그룹 */
.gsec{margin-top:36px;padding-top:28px;border-top:1px solid var(--line-2)}
.gsec.first{margin-top:22px;padding-top:0;border-top:0}
.gsechd{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.gsechd .gn{width:25px;height:25px;border-radius:var(--r-xs);background:var(--blue);
  color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.gsechd h3{font-size:18px;font-weight:900;letter-spacing:-.03em;flex:1;min-width:120px}
.gsecpg{font-size:var(--fs-micro);font-weight:800;padding:3px 9px;border-radius:var(--r-full);flex:none}
.gsecpg.ok{background:var(--good-weak);color:var(--good)}
.gsecpg.run{background:var(--blue-weak);color:var(--blue-ink)}
.gsecd{font-size:var(--fs-sm);color:var(--muted);line-height:1.55;margin-left:34px}
.gsec .field:first-of-type{margin-top:18px}
/* 하단 고정 내비 */
.stickynav{position:sticky;bottom:0;z-index:20;margin:26px -28px -26px;padding:14px 28px 16px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  border-radius:0 0 var(--r-lg) var(--r-lg)}
.stickynav .msg{font-size:var(--fs-sm);font-weight:700;margin-bottom:11px;padding:10px 13px;border-radius:var(--r-sm)}
.stickynav .msg.wait{color:var(--warn);background:var(--warn-weak)}
.stickynav .msg.done{color:var(--good);background:var(--good-weak)}
.robanner{background:var(--warn-weak);color:var(--warn);font-size:var(--fs-sm);font-weight:700;
  padding:12px 16px;border-radius:var(--r-sm);margin-bottom:16px;line-height:1.55}
.robanner b{color:var(--ink)}
.stickynav .row2{display:flex;align-items:center;gap:12px}
.stickynav .row2 .sp{flex:1}
.stickynav .btn{padding:13px 22px;font-size:15px;border-radius:var(--r-sm)}
@media (max-width:640px){.stickynav{margin:22px -20px -22px;padding:12px 20px 14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:30px 28px 26px;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.modal,.modal-bk{animation:none}}
.eyebrow{font-size:var(--fs-xs);font-weight:800;letter-spacing:.01em;color:var(--blue)}
.qtitle{font-size:var(--fs-display);font-weight:900;letter-spacing:-.035em;margin-top:7px;text-wrap:balance;line-height:1.28}
.qdesc{color:var(--sub);margin-top:11px;font-size:15px;line-height:1.62}
.who{display:inline-flex;gap:6px;margin-top:15px;font-size:var(--fs-xs);font-weight:800;
  padding:6px 12px;border-radius:var(--r-full);background:var(--blue-weak);color:var(--blue-ink)}

/* field */
.field{margin-top:26px}
.field:first-of-type{margin-top:22px}
.flabel{font-weight:800;font-size:var(--fs-h3);margin-bottom:12px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.flabel .req{color:var(--blue-ink);font-size:var(--fs-micro);font-weight:800;background:var(--blue-weak);
  padding:2px 7px;border-radius:var(--r-xs)}
.hint{color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.guide{background:var(--section);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;
  font-size:var(--fs-sm);line-height:1.65}
.guide .gw{color:var(--ink);font-weight:600;display:flex;gap:7px}
.guide .gl{color:var(--sub);margin-top:7px}
.guide .go{color:var(--blue-ink);margin-top:5px}
.guide .tagx{font-weight:800;margin-right:4px}
.guide .go .tagx{color:var(--blue)}
.guide b{font-weight:800}
/* policy card */
.pol{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px}
.pol .pt{background:var(--section);padding:11px 15px;font-weight:800;font-size:var(--fs-body);
  display:flex;gap:8px;align-items:center}
.pol .pt .b{background:var(--blue-weak);color:var(--blue-ink);font-size:10.5px;font-weight:800;
  border-radius:var(--r-xs);padding:2px 7px}
.pol .pd{padding:11px 15px;font-size:var(--fs-sm);color:var(--sub);line-height:1.65}
/* terms */
.term{border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;margin-bottom:8px;
  transition:border-color .15s,background .15s}
.term:hover{border-color:var(--line-2)}
.term .thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.term .tname{flex:1;font-weight:700;font-size:14.5px;min-width:150px}
.term .tcap{margin-top:8px;font-size:var(--fs-sm);color:var(--sub);line-height:1.6}
.term .note{margin-top:11px;width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:11px 13px;font-family:inherit;font-size:var(--fs-body);background:var(--card);color:var(--ink)}
.term .note:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}
.termfull{margin-top:10px;background:var(--section);border:0;color:var(--blue-ink);font-weight:700;
  font-size:var(--fs-sm);border-radius:var(--r-sm);padding:8px 13px;transition:background .15s}
.termfull:hover{background:var(--blue-weak)}
.tb{display:inline-block;font-size:10.5px;font-weight:800;border-radius:var(--r-xs);padding:2px 7px;
  margin-left:2px;vertical-align:1px}
.tb-req{color:var(--danger);background:var(--danger-weak)}
.tb-cond{color:var(--warn);background:var(--warn-weak)}
.tb-opt{color:var(--muted);background:var(--sunken)}
/* rows / checks */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--card);margin-bottom:8px;cursor:pointer;
  transition:border-color .15s,background .15s}
.row:hover{border-color:var(--line-2)}
.row.on{border-color:var(--blue);background:var(--blue-weak)}
.chk{width:22px;height:22px;border-radius:var(--r-xs);border:1.5px solid var(--line-2);display:grid;
  place-items:center;flex:none;color:#fff;font-size:13px;font-weight:900;transition:all .15s}
.row.on .chk{background:var(--blue);border-color:var(--blue)}
.row .txt{flex:1;font-weight:600;font-size:14.5px;min-width:0}
.row .na{border:1px solid var(--line-2);background:var(--card);color:var(--muted);font-size:var(--fs-xs);
  font-weight:700;border-radius:var(--r-sm);padding:7px 11px;white-space:nowrap}
.row.na-on{border-style:dashed;background:var(--section)}
.row.na-on .txt{color:var(--muted)}
.row.na-on .na{background:var(--muted);color:#fff;border-color:var(--muted)}
.filebtn{border:0;background:var(--blue-weak);color:var(--blue-ink);font-size:var(--fs-xs);font-weight:800;
  border-radius:var(--r-sm);padding:8px 13px;white-space:nowrap;transition:background .15s}
.filebtn:hover{background:#DDEAFD}
/* options */
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line-2);background:var(--card);color:var(--sub);border-radius:var(--r-sm);
  padding:11px 17px;font-weight:700;font-size:14px;transition:all .12s}
.opt:hover{border-color:var(--line-2);background:var(--section)}
.opt.on{border-color:var(--blue);background:var(--blue-weak);color:var(--blue-ink);font-weight:800}
.opt.warn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-weak)}
.chanrow{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chanrow .cname{font-weight:700;font-size:14.5px;min-width:110px}
.chanrow .opts{margin-left:auto}
/* inputs */
input[type=date],input[type=tel],input[type=password],input[type=text],.tinput{
  border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;
  font-size:14.5px;background:var(--card);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,.tinput:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}
input:disabled,.tinput:disabled{background:var(--section);color:var(--muted)}
textarea.ta{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:13px 15px;
  font-family:inherit;font-size:14.5px;background:var(--card);color:var(--ink);min-height:118px;
  resize:vertical;line-height:1.6;transition:border-color .15s,box-shadow .15s}
textarea.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak)}
/* nav / messages */
.nav{display:flex;align-items:center;gap:12px;margin-top:28px}
.nav .sp{flex:1}
.gatemsg{font-size:var(--fs-sm);color:var(--warn);font-weight:700;margin-top:16px;
  background:var(--warn-weak);padding:12px 14px;border-radius:var(--r-sm)}
.donemsg{font-size:var(--fs-sm);color:var(--good);font-weight:700;margin-top:16px;
  background:var(--good-weak);padding:12px 14px;border-radius:var(--r-sm)}
.finish{text-align:center;padding:44px 18px}
.finish .em{font-size:50px}
.finish .big{font-size:var(--fs-display);font-weight:900;letter-spacing:-.035em;margin-top:8px}
.finish p{color:var(--sub);margin-top:12px;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:var(--fs-xs);margin-top:18px}
/* landing / auth */
.landing{max-width:440px;margin:96px auto;text-align:center;padding:0 20px}
.landing .dot{width:50px;height:50px;border-radius:var(--r-md);margin:0 auto 20px;font-size:24px}
.landing h1{font-size:var(--fs-h1);font-weight:900;letter-spacing:-.035em}
.landing p{color:var(--sub);margin-top:11px;font-size:14.5px;line-height:1.6}
.authbox{max-width:352px;margin:20px auto 0;text-align:left}
.authbox .tinput + .tinput{margin-top:8px}
.autherr{color:var(--danger);font-size:var(--fs-sm);font-weight:600;margin-top:9px;
  background:var(--danger-weak);padding:9px 12px;border-radius:var(--r-sm)}
.authbtn{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:var(--r-md);
  padding:14px 0;font-weight:800;font-size:15px;transition:background .15s}
.authbtn:hover{background:var(--blue-d)}
.authbtn[disabled]{background:var(--sunken);color:var(--faint);cursor:not-allowed}
.authswap{display:block;margin:14px auto 0;border:0;background:transparent;color:var(--blue-ink);
  font-size:var(--fs-sm);font-weight:700;padding:6px}
.authswap:hover{text-decoration:underline}

/* ============================ MODAL ============================ */
.modal-bk{position:fixed;inset:0;z-index:100;background:rgba(25,31,40,.48);display:flex;align-items:center;
  justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:640px;width:100%;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:rise .2s}
.modal .mhd{display:flex;align-items:flex-start;gap:10px;padding:20px 22px 15px;border-bottom:1px solid var(--line)}
.modal .mhd h3{flex:1;font-size:var(--fs-h2);font-weight:800;line-height:1.4}
.modal .mtag{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:800;color:var(--blue-ink);
  background:var(--blue-weak);border-radius:var(--r-xs);padding:2px 7px;vertical-align:middle}
.modal .mclose{border:0;background:var(--section);color:var(--sub);width:30px;height:30px;
  border-radius:var(--r-sm);font-size:14px;flex:none}
.modal .mclose:hover{background:var(--sunken);color:var(--ink)}
.modal .mbody{padding:18px 22px;overflow-y:auto;font-size:var(--fs-body);line-height:1.78;color:var(--ink)}
.modal .mbody p{margin:0 0 13px;white-space:pre-wrap}
.modal .mbody p:last-child{margin-bottom:0}
.modal .mfoot{padding:14px 22px;border-top:1px solid var(--line);text-align:right}
.modal .mok{background:var(--blue);color:#fff;border:0;border-radius:var(--r-sm);padding:11px 22px;
  font-weight:800;font-size:var(--fs-body)}
.modal .mok:hover{background:var(--blue-d)}

/* ============================ ADMIN LAYOUT ============================ */
.adminmain{max-width:var(--wrap);margin:0 auto;padding:26px var(--pad) 64px}
.agrid{display:grid;grid-template-columns:296px 1fr;gap:18px;align-items:start}
@media(max-width:920px){.agrid{grid-template-columns:1fr}}
/* brand list */
.blist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;
  position:sticky;top:130px}
@media(max-width:920px){.blist{position:static}}
.blist .lt{font-size:var(--fs-micro);font-weight:800;color:var(--muted);padding:7px 10px 9px;
  letter-spacing:.02em;text-transform:uppercase}
.bitem{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--r-md);cursor:pointer;
  border:1px solid transparent;transition:background .12s,border-color .12s}
.bitem:hover{background:var(--section)}
.bitem.on{background:var(--blue-weak);border-color:#CFE0FC}
.bitem .bn{font-weight:700;font-size:14px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem .pct{font-size:var(--fs-sm);font-weight:800;color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
.bitem.done .pct{color:var(--good)}
.mini{height:5px;border-radius:var(--r-full);background:var(--line);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--blue);transition:width .4s;border-radius:var(--r-full)}
.bitem.done .mini i{background:var(--good)}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mv button{border:1px solid var(--line-2);background:var(--card);color:var(--muted);border-radius:var(--r-xs);
  font-size:10px;line-height:1;width:22px;height:16px;display:grid;place-items:center;transition:all .12s}
.mv button:hover:not(:disabled){color:var(--blue);border-color:var(--blue);background:var(--blue-weak)}
.mv button:disabled{opacity:.28;cursor:default}
.addrow{display:flex;gap:8px;margin-top:10px;padding:8px 4px 4px;border-top:1px solid var(--line)}
.addrow input{flex:1;min-width:0;font-size:var(--fs-body);padding:10px 12px}
.addrow button{border:0;background:var(--blue);color:#fff;border-radius:var(--r-sm);padding:10px 16px;
  font-weight:800;font-size:var(--fs-body);flex:none;transition:background .15s}
.addrow button:hover{background:var(--blue-d)}
.linkbox{margin:10px 4px 0;padding:12px 14px;border-radius:var(--r-md);font-size:var(--fs-xs);
  color:var(--sub);background:var(--blue-weak);line-height:1.6}
.linkbox b{color:var(--ink)}
.linkbox .u{display:block;margin:7px 0;color:var(--blue-ink);overflow-wrap:anywhere;font-weight:700;
  font-size:var(--fs-micro)}

/* ============================ USERS / ME ============================ */
.urow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow:hover{background:var(--section)}
.uav{width:34px;height:34px;border-radius:var(--r-full);background:var(--sunken);color:var(--sub);
  display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm);flex:none}
.uinfo{flex:1;min-width:170px}
.uinfo .un{font-weight:800;font-size:14px}
.uinfo .um{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.urole{font-size:var(--fs-micro);font-weight:800;border-radius:var(--r-xs);padding:3px 9px;flex:none}
.r-super{color:var(--purple);background:var(--purple-weak)}
.r-admin{color:var(--blue-ink);background:var(--blue-weak)}
.r-member{color:var(--muted);background:var(--sunken)}
.formrow{margin-bottom:16px}
.formrow:last-child{margin-bottom:0}
.formrow .fl{font-size:var(--fs-sm);font-weight:700;color:var(--sub);margin-bottom:7px}
.formrow .fh{font-size:var(--fs-xs);color:var(--muted);margin-top:6px}

/* ============================ WBS ============================ */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.kcard .kl{font-size:var(--fs-xs);font-weight:700;color:var(--muted);margin-bottom:6px}
.kcard .kv{font-size:28px;font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.15}
.kcard .kv span{font-size:15px;font-weight:800;color:var(--faint);margin-left:1px}
.kcard .kv.b{color:var(--blue)} .kcard .kv.w{color:var(--warn)} .kcard .kv.g{color:var(--good)}
.kcard .ks{font-size:var(--fs-micro);color:var(--faint);margin-top:5px}
.wscroll{overflow-x:auto;scrollbar-width:thin}
.wtbl{width:100%;min-width:840px;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm)}
.wtbl th{font-size:var(--fs-micro);font-weight:800;color:var(--muted);text-align:center;padding:14px 6px 11px;
  background:var(--section);border-bottom:1px solid var(--line);letter-spacing:.01em}
.wtbl th:first-child{text-align:left;padding-left:20px;border-radius:0}
.wtbl th:last-child{padding-right:20px}
.wtbl td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
.wtbl td:first-child{text-align:left;padding-left:20px}
.wtbl th.l,.wtbl td.l{text-align:left}
.mwtbl th:first-child,.mwtbl td:first-child{padding-right:14px}
.wtbl td:last-child{padding-right:20px}
.wtbl tr:last-child td{border-bottom:0}
.wtbl tr.wrow{cursor:pointer;transition:background .12s}
.wtbl tr.wrow:hover td{background:var(--section)}
.wbn{font-weight:800;font-size:14px;color:var(--ink);letter-spacing:-.015em}
.wcell{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;
  padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-micro);font-weight:800}
.wc-done{background:var(--blue);color:#fff}
.wc-prog{background:var(--blue-weak);color:var(--blue-ink)}
.wc-wait{background:var(--sunken);color:var(--faint)}
.wbar{position:relative;width:88px;height:6px;border-radius:var(--r-full);background:var(--line);
  overflow:hidden;display:inline-block;vertical-align:middle}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:var(--r-full)}
.wbar.f i{background:var(--good)}
.wpct{font-size:var(--fs-sm);font-weight:800;color:var(--ink);margin-left:8px;font-variant-numeric:tabular-nums}
.wstage{font-size:var(--fs-xs);font-weight:700;color:var(--sub)}
.wago{font-size:var(--fs-xs);color:var(--muted)}
.wago.stale{color:var(--warn);font-weight:800}
.wlegend{display:flex;gap:14px;align-items:center;padding:13px 20px;border-top:1px solid var(--line);
  font-size:var(--fs-micro);color:var(--muted);flex-wrap:wrap;background:var(--section)}
.wlegend .d{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* blockers */
.brow{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bnm{font-weight:800;font-size:var(--fs-sm);color:var(--ink);flex:none;width:126px}
.brow .bitems{flex:1;font-size:var(--fs-sm);color:var(--sub);line-height:1.75;min-width:0}
.brow .bitems .sx{color:var(--faint);font-weight:800;font-size:var(--fs-micro)}
.gate{display:inline-block;font-size:10px;font-weight:800;color:var(--danger);background:var(--danger-weak);
  border-radius:4px;padding:1px 6px;margin-left:4px}
.redoc{display:inline-block;font-size:10px;font-weight:800;color:var(--warn);background:var(--warn-weak);
  border-radius:4px;padding:1px 6px;margin-left:4px}
.wdone{padding:22px 20px;font-size:var(--fs-sm);font-weight:700;color:var(--good);
  background:var(--good-weak);display:flex;gap:8px;align-items:center}

/* ============================ SHEET (브랜드 상세) ============================ */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.sheethd{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--section)}
.sheethd .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheethd h3{font-size:19px;font-weight:900;letter-spacing:-.035em}
.sheethd .r2{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;align-items:center}
.metaline{color:var(--muted);font-size:var(--fs-xs);font-weight:600;margin-top:6px}
.pill{font-size:var(--fs-micro);font-weight:800;padding:5px 11px;border-radius:var(--r-full)}
.p-done{background:var(--good-weak);color:var(--good)}
.p-prog{background:var(--blue-weak);color:var(--blue-ink)}
.p-wait{background:var(--sunken);color:var(--muted)}
.sstep{border-bottom:1px solid var(--line)}
.sstep:last-child{border-bottom:0}
.sstep .sh{width:100%;display:flex;align-items:center;gap:9px;padding:15px 22px;background:none;
  border:0;text-align:left;font-family:inherit;transition:background .12s}
.sstep .sh:hover{background:var(--section)}
.sstep.open .sh{background:var(--section)}
.sstep .sh .cv{flex:none;color:var(--muted);font-size:11px;transition:transform .18s;margin-left:2px}
.sstep.open .sh .cv{transform:rotate(180deg);color:var(--blue)}
.sstep .sh .cnt{flex:none;font-size:var(--fs-micro);font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums}
.sstep .sbody{padding:4px 22px 18px}
.sstep h4{font-size:var(--fs-h3);font-weight:900;display:flex;align-items:center;gap:9px;margin:0;flex:1;min-width:0;
  letter-spacing:-.02em}
.arow{display:flex;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.ak{width:180px;flex:none;color:var(--muted);font-weight:700;font-size:var(--fs-sm)}
.av{flex:1;min-width:0;font-weight:600;font-size:var(--fs-body);color:var(--ink);display:flex;
  flex-wrap:wrap;gap:6px;align-items:center}
.av.plain{display:block}
@media(max-width:620px){.arow{flex-direction:column;gap:3px}.ak{width:auto}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;
  padding:4px 10px;border-radius:var(--r-xs);background:var(--sunken);color:var(--sub)}
.chip.ok{background:var(--good-weak);color:var(--good)}
.chip.chg{background:var(--warn-weak);color:var(--warn)}
.chip.no{background:var(--sunken);color:var(--muted)}
.chip.file{background:var(--blue-weak);color:var(--blue-ink)}
.chip .dl{color:var(--blue);font-weight:800;text-decoration:none;border-bottom:1.5px solid var(--blue);margin-left:4px}
.notequote{color:var(--sub);font-weight:600;font-size:var(--fs-sm);font-style:italic}
/* ---- 마스터 WBS (전체 현황) ---- */
.wtbl tr.wrow.on td{background:var(--blue-weak)}
.mwsum td{font-size:var(--fs-sm);font-weight:700}
.mdim{color:var(--faint);font-weight:600}
.mcur{color:var(--sub);font-weight:700;font-size:var(--fs-xs)}
.mhead{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px}
.mchip{border:1px solid var(--line-2);background:var(--card);color:var(--sub);font-weight:700;
  font-size:var(--fs-sm);padding:8px 14px;border-radius:var(--r-full);cursor:pointer;transition:all .12s}
.mchip:hover{border-color:var(--blue);color:var(--blue)}
.mchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mopen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunken);
  border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px}
.mopen label{font-size:var(--fs-sm);font-weight:800;color:var(--ink)}
.mopen .tinput{width:170px;margin:0}
.mopen .mov{font-size:var(--fs-h3);font-weight:900;color:var(--ink);letter-spacing:-.02em}
.mopen .mh{font-size:var(--fs-xs);color:var(--muted);flex:1;min-width:180px}
.mnext{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);
  border-left:3px solid var(--blue);border-radius:var(--r-sm);padding:13px 16px;margin-bottom:16px}
.mnext .nl{font-size:var(--fs-micro);font-weight:800;color:var(--muted)}
.mnext .nv{font-size:var(--fs-sm);font-weight:800;color:var(--ink);flex:1;min-width:200px}
.mwtbl{min-width:1080px}
.mwtbl td{font-size:var(--fs-xs);padding:9px 6px}
.mwtbl td.mid{color:var(--faint);font-weight:800;font-variant-numeric:tabular-nums}
.mwtbl .mtn{font-weight:700;color:var(--ink);font-size:var(--fs-sm);line-height:1.45}
.mwtbl tr.na{opacity:.45}
.mwtbl tr.lt td{background:var(--danger-weak)}
.mwtbl tr.lt:hover td{background:var(--danger-weak)}
.mgate{display:inline-block;margin-left:6px;font-size:var(--fs-micro);font-weight:800;color:var(--blue-ink);
  background:var(--blue-weak);border-radius:var(--r-xs);padding:2px 6px;vertical-align:1px}
.mown{display:inline-block;font-size:var(--fs-micro);font-weight:800;padding:3px 8px;border-radius:var(--r-full)}
.mown.o-s{background:var(--blue-weak);color:var(--blue-ink)}
.mown.o-b{background:var(--good-weak);color:var(--good)}
.mown.o-j{background:var(--purple-weak);color:var(--purple)}
.mdep{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mdt{font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.mst{display:inline-block;font-size:var(--fs-micro);font-weight:800;padding:4px 9px;border-radius:var(--r-full);white-space:nowrap}
.mst.s-done{background:var(--good-weak);color:var(--good)}
.mst.s-prog{background:var(--blue-weak);color:var(--blue-ink)}
.mst.s-prep{background:var(--purple-weak);color:var(--purple)}
.mst.s-hold,.mst.s-undec{background:var(--warn-weak);color:var(--warn)}
.mst.s-wait{background:var(--sunken);color:var(--muted)}
.mst.s-na{background:transparent;color:var(--faint)}
.mlate{display:inline-block;margin-left:5px;font-size:var(--fs-micro);font-weight:800;
  background:var(--danger-weak);color:var(--danger);padding:4px 7px;border-radius:var(--r-full);white-space:nowrap}
.msel{font-size:var(--fs-micro);font-weight:700;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-xs);padding:5px 6px;max-width:96px}
.mnote{width:100%;font-size:var(--fs-micro);color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:6px 8px;font-family:inherit}
.mnote:focus{outline:none;border-color:var(--blue)}
.mnt{color:var(--muted);font-size:var(--fs-micro);line-height:1.5}
/* input[type=date] 전역 규칙(specificity 0,1,1)보다 높게 잡아야 적용돼요 */
.mwtbl input.mdue{width:106px;font-size:var(--fs-micro);font-weight:800;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-xs);padding:0 6px;height:28px;line-height:1;
  font-family:inherit;vertical-align:middle}
.mwtbl input.mdue:focus{outline:none;border-color:var(--blue)}
.mwtbl input.mdue.auto{color:var(--muted);font-weight:700;border-style:dashed}
.mwtbl select.msel,.mwtbl input.mnote{vertical-align:middle}
.mdt.fx{color:var(--ink);font-weight:800}
.mdauto{display:inline-block;font-size:9.5px;color:var(--faint);font-weight:700;margin-left:5px;white-space:nowrap}
.mwtbl td.mstc,.mwtbl td.mntc{white-space:normal}
.mwtbl tr.mph td{background:var(--section);border-top:1px solid var(--line-2);padding:11px 20px;text-align:left}
.mpht{font-size:var(--fs-h3);font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-right:10px}
.mphb{display:inline-block;position:relative;width:72px;height:5px;border-radius:var(--r-full);
  background:var(--line-2);overflow:hidden;vertical-align:2px}
.mphb i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:var(--r-full)}
.mphp{font-size:var(--fs-micro);font-weight:800;color:var(--blue-ink);margin-left:6px}
.mphc{font-size:var(--fs-micro);font-weight:700;color:var(--muted);margin-left:8px}
.mphs{display:block;font-size:var(--fs-micro);color:var(--muted);margin-top:4px;font-weight:600}
.mtog{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;color:var(--sub);cursor:pointer}
.mnabox{padding:12px 20px;border-top:1px solid var(--line);font-size:var(--fs-micro);color:var(--muted);line-height:1.6}
.mnabox b{color:var(--sub)}
@media (max-width:760px){
  .kgrid{grid-template-columns:repeat(2,1fr)}
  .mopen .tinput{width:100%}
}
.empty{padding:72px 24px;text-align:center;color:var(--muted);font-size:var(--fs-body)}
.foot2{color:var(--muted);font-size:var(--fs-xs);line-height:1.65;margin-top:16px}
.dangerzone{display:flex;align-items:center;gap:12px;padding:14px 20px;margin-top:16px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--section);flex-wrap:wrap}
.dangerzone .dzt{flex:1;min-width:200px;font-size:var(--fs-xs);color:var(--muted);line-height:1.6}
.dangerzone .dzt b{color:var(--sub);font-size:var(--fs-sm)}

@media (max-width:640px){
  :root{--pad:16px}
  .kgrid{grid-template-columns:repeat(2,1fr)}
  .card{padding:24px 20px 22px}
  .qtitle{font-size:23px}
  .top{height:54px}
  .subnav{top:54px}
  .blist{top:auto}
}

/* ============================ PRINT ============================ */
#printroot{display:none}
@media print{
  @page{size:A4;margin:14mm}
  .top,.subnav,#app{display:none!important}
  #printroot{display:block!important}
  body{background:#fff}
}
