function fmt(iso){try{const d=new Date(iso);return d.getFullYear()+"."+p2(d.getMonth()+1)+"."+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());}catch(e){return iso.slice(0,16);}}
const p2=n=>(""+n).padStart(2,"0");
const arow=(k,v)=>`<div class="arow"><div class="ak">${esc(k)}</div><div class="av">${v}</div></div>`;
const chip=(t,c="")=>`<span class="chip ${c}">${esc(t)}</span>`;
function answers(st,data){
  let out="";
  st.fields.forEach(f=>{if(f.type==="info"||f.type==="docs"||f.type==="downloads")return;if(f.showIf&&!f.showIf(data))return;const v=data[f.k];const lab=f.alabel||shortL(f.label);
    if(f.type==="multi"){const a=Array.isArray(v)?v:[];out+=arow(lab,a.length?a.map(x=>chip(x,"ok")).join(" "):"—");}
    else if(f.type==="confirm")out+=arow(lab,v===true?chip("완료 ✓","ok"):"—");
    else if(f.type==="textarea")out+=arow(lab,v?`<span class="notequote">“${esc(v)}”</span>`:"—");
    else if(f.type==="date"||f.type==="text")out+=arow(lab,v?esc(v):"—");
    else if(f.type==="radio")out+=arow(lab,v?chip(v,v==="변경·요청 있음"||v==="변경·요청"||v==="미적용"||(f.mustBe&&v!==f.mustBe)?"chg":"ok"):"—");
    else if(f.type==="inputs")f.items.forEach(it=>{const tv=(((v||{})[it.id])||"").trim();out+=arow(it.alabel||shortL(it.label),tv?`<span class="av plain">${esc(tv)}</span>`:"—");});
    else if(f.type==="checklist"){
      const parts=f.items.map(it=>{const s=(v||{})[it.id];
        if(s&&typeof s==="object"&&s.key){
          const act=s.redo?`<span class="chip chg">보완 요청 중${s.redo.msg?` · “${esc(s.redo.msg)}”`:""}</span>${canEdit()?`<button class="ghost" data-redocancel="${f.k}|${it.id}">요청 취소</button>`:""}`
                          :(canEdit()?`<button class="ghost" data-redo="${f.k}|${it.id}">보완 요청</button>`:"");
          return `<span class="chip file">📎 ${esc(shortL(it.label))} · ${esc(s.name)} <a class="dl" href="#" data-dl="${esc(s.key)}">다운로드</a></span> ${act}`;}
        if(s==="done")return chip(shortL(it.label)+" ✓","ok");
        if(s==="na")return chip(shortL(it.label)+" · 해당없음","no");
        return "";}).filter(Boolean);
      out+=arow(lab,parts.join(" ")||"—");}
    else if(f.type==="terms"){const arr=f.items.map((t,i)=>({t,c:(v||{})[i]}));
      const std=arr.filter(x=>x.c&&x.c.choice==="표준").length;const chg=arr.filter(x=>x.c&&x.c.choice==="변경");
      const naC=arr.filter(x=>x.c&&x.c.choice==="해당없음").length;
      out+=arow(lab,`${chip("표준 그대로 "+std+"건","ok")} ${chg.length?chip("변경요청 "+chg.length+"건","chg"):chip("변경 0건","no")}${naC?" "+chip("해당없음 "+naC+"건","no"):""}`);
      chg.forEach(x=>out+=arow("↳ "+x.t.n,`${chip("변경","chg")} <span class="notequote">${x.c.note?'“'+esc(x.c.note)+'”':"(내용 미기재)"}</span>`));}
    else if(f.type==="channels")f.items.forEach(it=>{const cv=(v||{})[it.id];
      const disp=Array.isArray(cv)?(cv.length?cv.map(x=>chip(x,x==="미사용"?"no":"ok")).join(" "):"—"):(cv?chip(cv,(cv==="미사용"||cv==="미도입")?"no":"ok"):"—");
      out+=arow(it.label,disp);});
  });
  return out;
}

  </style>${html}`;
  const prevTitle=document.title;document.title="온보딩결과지_"+b.name;
  window.onafterprint=()=>{document.title=prevTitle;window.onafterprint=null;};
  window.print();
}

/* ================= events ================= */
function findField(fk){for(const st of STEPS)for(const f of st.fields)if(f.k===fk)return f;return null;}
function openTermFull(fk,i){
  const f=findField(fk);if(!f||!f.items[i])return;const t=f.items[i];
  const paras=(t.full||[t.s||""]).map(p=>`<p>${esc(p)}</p>`).join("");
  const bk=document.createElement("div");bk.className="modal-bk";
  bk.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mhd"><h3>${i+1}. ${esc(t.n)}<span class="mtag">표준 양식 전문</span></h3><button class="mclose" aria-label="닫기">✕</button></div><div class="mbody">${paras}</div><div class="mfoot"><button class="mok">확인</button></div></div>`;
  const close=()=>{bk.remove();document.removeEventListener("keydown",onKey);};
  function onKey(e){if(e.key==="Escape")close();}
  bk.addEventListener("click",e=>{if(e.target===bk)close();});
  bk.querySelector(".mclose").onclick=close;bk.querySelector(".mok").onclick=close;
  document.addEventListener("keydown",onKey);document.body.appendChild(bk);
}
function bind(){
  if(S.readonly)document.querySelectorAll("#app input,#app textarea").forEach(el=>el.disabled=true);
  document.querySelectorAll("[data-openbrand]").forEach(el=>el.onclick=()=>{

    /* 최고관리자: 브랜드 토큰으로 열어 그대로 수정 가능 · 일반관리자: 토큰 없이 열람 전용 */
    window.open(base+(tok?"?b="+encodeURIComponent(tok):"?view="+encodeURIComponent(el.dataset.openbrand)),"_blank");});
  document.querySelectorAll("[data-termfull]").forEach(el=>el.onclick=()=>openTermFull(el.dataset.termfull,+el.dataset.i));
  document.querySelectorAll("[data-asset]").forEach(el=>el.onclick=async()=>{const t=el.textContent;el.textContent="링크 생성 중…";
    try{const r=await api(`/api/asset-url?b=${encodeURIComponent(BTOK||"")}&k=${encodeURIComponent(AKEY||"")}&name=${el.dataset.asset}`);window.open(r.url,"_blank");}
    catch(e){alert("다운로드 링크 생성에 실패했어요. 잠시 후 다시 시도해 주세요.");}

  document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{if(el.hasAttribute("disabled"))return;S.viewStep=+el.dataset.go;render();window.scrollTo({top:0,behavior:"smooth"});});
  if(!S.readonly){
  document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{const k=el.dataset.toggle;set(k,D()[k]===true?false:true);});
  document.querySelectorAll("[data-input]").forEach(el=>el.onchange=()=>set(el.dataset.input,el.value));
  document.querySelectorAll("[data-radio]").forEach(el=>el.onclick=()=>set(el.dataset.radio,el.dataset.val));
  document.querySelectorAll("[data-cl]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-na]"))return;toggleItem(el.dataset.cl,el.dataset.item);});
  document.querySelectorAll("[data-na]").forEach(el=>el.onclick=e=>{e.stopPropagation();setNa(el.dataset.na,el.dataset.item);});
  document.querySelectorAll("[data-term]").forEach(el=>el.onclick=()=>setTerm(el.dataset.term,+el.dataset.i,el.dataset.val));
  document.querySelectorAll("[data-tnote]").forEach(el=>el.oninput=()=>setTermNote(el.dataset.tnote,+el.dataset.i,el.value));
  document.querySelectorAll("[data-chan]").forEach(el=>el.onclick=()=>setChan(el.dataset.chan,el.dataset.item,el.dataset.val,el.dataset.multi==="true"));
  document.querySelectorAll("[data-multi2]").forEach(el=>el.onclick=()=>setMulti(el.dataset.multi2,el.dataset.val));
  document.querySelectorAll("[data-ta]").forEach(el=>{el.oninput=()=>{D()[el.dataset.ta]=el.value;scheduleSave();};el.onchange=()=>render();});
  document.querySelectorAll("[data-tin]").forEach(el=>{el.oninput=()=>{const k=el.dataset.tin;D()[k]=D()[k]||{};D()[k][el.dataset.item]=el.value;scheduleSave();};el.onchange=()=>render();});
  document.querySelectorAll("[data-up]").forEach(el=>el.onclick=e=>{e.stopPropagation();const inp=document.querySelector(`input[data-fin="${el.dataset.up}"][data-item="${el.dataset.item}"]`);if(inp)inp.click();});
  document.querySelectorAll("[data-fin]").forEach(el=>el.onchange=()=>uploadFile(el.dataset.fin,el.dataset.item,el.files[0]));
  }
  document.querySelectorAll("[data-asel]").forEach(el=>el.onclick=()=>{S.adminSel=+el.dataset.asel;S.newLink=null;S.copiedLink=null;S.openStep=null;render();});
  document.querySelectorAll("[data-sstep]").forEach(el=>el.onclick=()=>{const i=+el.dataset.sstep;S.openStep=(S.openStep===i)?null:i;render();});
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>navigator.clipboard.writeText(el.dataset.copy).then(()=>el.textContent="복사됨 ✓"));
  document.querySelectorAll("[data-copybrand]").forEach(el=>el.onclick=()=>{const b=S.brands[+el.dataset.copybrand];const url=location.origin+location.pathname.replace(/admin\/?$/,"")+"?b="+b.token;
    navigator.clipboard.writeText(url).then(()=>{S.copiedLink={id:b.id,url};render();})
      .catch(()=>{S.copiedLink={id:b.id,url};render();});});
  document.querySelectorAll("[data-pdf]").forEach(el=>el.onclick=()=>openPdf(S.brands[+el.dataset.pdf]));
  document.querySelectorAll("[data-redo]").forEach(el=>el.onclick=async()=>{
    const [fk,it]=el.dataset.redo.split("|");
    const msg=prompt("보완 요청 사유를 입력하세요 (브랜드 화면에 그대로 표시돼요)","");
    if(msg===null)return;
    const b=S.brands[S.adminSel];
    b.data[fk][it]=Object.assign({},b.data[fk][it],{redo:{msg:msg.trim(),at:new Date().toISOString()}});
    try{await api("/api/brand?b="+encodeURIComponent(b.token),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({data:b.data})});}
    catch(e){alert("저장에 실패했어요.");}
    render();});
  document.querySelectorAll("[data-redocancel]").forEach(el=>el.onclick=async()=>{
    const [fk,it]=el.dataset.redocancel.split("|");
    const b=S.brands[S.adminSel];
    const o=Object.assign({},b.data[fk][it]);delete o.redo;b.data[fk][it]=o;
    try{await api("/api/brand?b="+encodeURIComponent(b.token),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({data:b.data})});}
    catch(e){alert("저장에 실패했어요.");}
    render();});
  const mvBrand=async(i,d)=>{const j=i+d;if(j<0||j>=S.brands.length)return;
    const t=S.brands[i];S.brands[i]=S.brands[j];S.brands[j]=t;
    if(S.adminSel===i)S.adminSel=j;else if(S.adminSel===j)S.adminSel=i;
    render();
    try{await api("/api/brands?k="+encodeURIComponent(AKEY),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({order:S.brands.map(b=>b.id)})});}catch(e){}};
  document.querySelectorAll("[data-mvup]").forEach(el=>el.onclick=e=>{e.stopPropagation();mvBrand(+el.dataset.mvup,-1);});
  document.querySelectorAll("[data-mvdn]").forEach(el=>el.onclick=e=>{e.stopPropagation();mvBrand(+el.dataset.mvdn,1);});
  document.querySelectorAll("[data-dl]").forEach(el=>el.onclick=async e=>{e.preventDefault();
    try{const r=await api("/api/file-url?k="+encodeURIComponent(AKEY)+"&key="+encodeURIComponent(el.dataset.dl));window.open(r.url,"_blank");}
    catch(err){alert("다운로드 링크 생성에 실패했어요.");}});
  const rf=document.getElementById("refresh");if(rf)rf.onclick=loadAdmin;
  document.querySelectorAll("[data-atab]").forEach(el=>el.onclick=async()=>{S.adminTab=el.dataset.atab;S.meMsg=null;if(S.adminTab==="users")await loadUsers();render();});
  document.querySelectorAll("[data-wsel]").forEach(el=>el.onclick=()=>{S.adminSel=+el.dataset.wsel;S.adminTab="brands";S.newLink=null;S.copiedLink=null;S.openStep=null;render();window.scrollTo({top:0,behavior:"smooth"});});
  document.querySelectorAll("[data-mwsel]").forEach(el=>el.onclick=()=>{S.mwSel=+el.dataset.mwsel;render();});
  const mo=document.getElementById("mw_open");
  if(mo)mo.onchange=async()=>{const b=S.brands[S.mwSel];opsSet(b,"open",null,mo.value);render();await saveOps(b);};
  const mna=document.getElementById("mw_na");
  if(mna)mna.onchange=()=>{S.mwNa=mna.checked;render();};
  document.querySelectorAll("[data-mwst]").forEach(el=>el.onchange=async()=>{
    const b=S.brands[S.mwSel];opsSet(b,"st",el.dataset.mwst,el.value);render();await saveOps(b);});
  document.querySelectorAll("[data-mwnote]").forEach(el=>{
    el.onblur=async()=>{const b=S.brands[S.mwSel];
      if(opsNote(b,el.dataset.mwnote)===el.value.trim())return;
      opsSet(b,"note",el.dataset.mwnote,el.value.trim());await saveOps(b);};
    el.onkeydown=e=>{if(e.key==="Enter")el.blur();};});
  document.querySelectorAll("[data-mwdue]").forEach(el=>el.onchange=async()=>{
    const b=S.brands[S.mwSel],id=el.dataset.mwdue;
    const auto=el.classList.contains("auto")?el.defaultValue:"";
    opsSet(b,"due",id,(el.value&&el.value!==auto)?el.value:"");
    render();await saveOps(b);});
  const mpdf=document.getElementById("mwpdf");if(mpdf)mpdf.onclick=()=>openMasterPdf();
  const wp=document.getElementById("wbspdf");if(wp)wp.onclick=()=>openWbsPdf();
  document.querySelectorAll("[data-grant]").forEach(el=>el.onclick=async()=>{try{await api("/api/users?k="+encodeURIComponent(AKEY),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({phone:el.dataset.grant,role:"admin"})});}catch(e){alert("권한 부여에 실패했어요.");}await loadUsers();render();});
  document.querySelectorAll("[data-revoke]").forEach(el=>el.onclick=async()=>{try{await api("/api/users?k="+encodeURIComponent(AKEY),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({phone:el.dataset.revoke,role:"member"})});}catch(e){alert("권한 해제에 실패했어요.");}await loadUsers();render();});
  document.querySelectorAll("[data-udel]").forEach(el=>el.onclick=async()=>{if(!confirm("이 회원을 삭제할까요?"))return;try{await api("/api/users?phone="+encodeURIComponent(el.dataset.udel)+"&k="+encodeURIComponent(AKEY),{method:"DELETE"});}catch(e){alert("삭제에 실패했어요.");}await loadUsers();render();});
  const ms=document.getElementById("me_save");if(ms)ms.onclick=async()=>{
    const nm=document.getElementById("me_name").value.trim(),og=document.getElementById("me_org").value.trim();
    if(!nm){S.meMsg="이름을 입력해 주세요.";S.meMsgErr=true;render();return;}
    try{await api("/api/me?k="+encodeURIComponent(AKEY),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({name:nm,org:og})});
      S.me.name=nm;S.me.org=og;S.meMsg="프로필을 저장했어요.";S.meMsgErr=false;}
    catch(e){S.meMsg="저장에 실패했어요.";S.meMsgErr=true;}
    render();};
  const mlo=document.getElementById("me_logout");if(mlo)mlo.onclick=()=>{const a=document.getElementById("akout");if(a)a.click();};
  const mp=document.getElementById("me_pw");if(mp)mp.onclick=async()=>{
    const cur=document.getElementById("me_cur").value,nw=document.getElementById("me_new").value;
    if(nw.length<8){S.meMsg="새 비밀번호는 8자 이상으로 해주세요.";S.meMsgErr=true;render();return;}
    try{await api("/api/me?k="+encodeURIComponent(AKEY),{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({currentPassword:cur,newPassword:nw})});
      S.meMsg="비밀번호를 변경했어요.";S.meMsgErr=false;}
    catch(e){S.meMsg="현재 비밀번호가 올바르지 않아요.";S.meMsgErr=true;}
    render();};
  const ako=document.getElementById("akout");if(ako)ako.onclick=()=>{
    localStorage.removeItem("smt_akey");AKEY="";S.me=null;
    if(qsp.get("k")||!ADMIN_PATH){location.href=location.origin+location.pathname.replace(/(admin\/?)?$/,"")+"admin/";return;}
    S.mode="keyin";S.keyerr=null;S.authView="login";render();};
  const ab=document.getElementById("addb");if(ab)ab.onclick=async()=>{const inp=document.getElementById("newb");const name=inp.value.trim();if(!name)return;
    const r=await api("/api/brands?k="+encodeURIComponent(AKEY),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name})});
    S.newLink={name:r.name,url:location.origin+location.pathname.replace(/admin\/?$/,"")+"?b="+r.token};await loadAdmin();};
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{if(!confirm("이 브랜드와 제출 데이터를 삭제할까요?"))return;
    await api("/api/brand?id="+encodeURIComponent(el.dataset.del)+"&k="+encodeURIComponent(AKEY),{method:"DELETE"});S.newLink=null;await loadAdmin();});
}

/* ================= boot ================= */
async function loadUsers(){
  try{const r=await api("/api/users?k="+encodeURIComponent(AKEY));S.users=r.users;}catch(e){S.users=[];}
}
async function loadAdmin(){
  try{
    const me=await api("/api/me?k="+encodeURIComponent(AKEY));S.me=me;
    if(me.role!=="superadmin"&&me.role!=="admin"){localStorage.setItem("smt_akey",AKEY);S.mode="pending";render();return;}
    const r=await api("/api/brands?k="+encodeURIComponent(AKEY));S.brands=r.brands;S.mode="admin";localStorage.setItem("smt_akey",AKEY);
    if(S.adminTab==="users")await loadUsers();
  }
  catch(e){
    if(ADMIN_PATH){localStorage.removeItem("smt_akey");AKEY="";S.mode="keyin";S.keyerr="로그인이 만료됐어요. 다시 로그인해 주세요.";}
    else{S.mode="error";S.errmsg="관리자 키가 올바르지 않아요.";}
  }
  render();
}
(async()=>{
  if(VIEWID){
    if(!AKEY){S.mode="error";S.errmsg="관리자 로그인이 필요해요. 관리자 페이지에서 [브랜드 페이지 열기]로 다시 열어주세요.";render();return;}
    render();
    try{const r=await api("/api/brand-view?id="+encodeURIComponent(VIEWID)+"&k="+encodeURIComponent(AKEY));
      S.brand={name:r.name,data:r.data||{}};S.mode="brand";}
    catch(e){S.mode="error";S.errmsg="브랜드 정보를 불러올 수 없어요. 관리자 권한이 있는지 확인해 주세요.";}
    render();return;}
  if(S.mode==="brand"){S.mode="loading";render();
    try{const r=await api("/api/brand?b="+encodeURIComponent(BTOK));S.brand={name:r.name,data:r.data||{}};S.mode="brand";}
    catch(e){S.mode="error";S.errmsg="브랜드 링크가 올바르지 않아요. 담당 매니저에게 문의해 주세요.";}
    render();}
  else if(S.mode==="admin"){S.mode="loading";render();await loadAdmin();}
  else render();
})();
